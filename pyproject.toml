[project]
name = "gwu-rml-course"
version = "0.1.0"
description = "Python environment and local examples for GWU DNSC 6330 Responsible Machine Learning"
license = "MIT"
license-files = ["SOFTWARE_LICENSE.txt"]
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
neural = [
    "tensorflow>=2.16,<3",
]

[dependency-groups]
course = [
    "interpret>=0.6,<0.8",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.8,<4",
    "notebook>=7.2,<8",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "shap>=0.50,<0.52",
    "xgboost>=2,<4",
    "xlrd>=2,<3",
]
legacy-h2o = [
    "h2o>=3.46,<3.47",
    "interpret>=0.6,<0.8",
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.8,<4",
    "notebook>=7.2,<8",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "seaborn>=0.13,<1",
    "shap>=0.45,<0.50",
    "xgboost>=2,<3",
    "xlrd>=2,<3",
]
notebook-execution = [
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["util*"]

[tool.uv]
default-groups = ["legacy-h2o", "notebook-execution"]
conflicts = [[{ group = "course" }, { group = "legacy-h2o" }]]

